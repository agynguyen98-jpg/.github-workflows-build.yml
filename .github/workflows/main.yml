name: build-pig2-slayer-plus
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Tao ma nguon
        run: |
          cat > settings.gradle <<'P2S_EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
                  maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
              }
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id == 'org.spongepowered.mixin') {
                          useModule('org.spongepowered:mixingradle:' + requested.version)
                      }
                  }
              }
          }
          rootProject.name = 'pig2_slayer_plus'
          P2S_EOF
          cat > gradle.properties <<'P2S_EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          P2S_EOF
          cat > build.gradle <<'P2S_EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
              id 'org.spongepowered.mixin' version '0.7.+'
          }

          group = 'com.pig2.slayerplus'
          version = '1.1.0'
          base { archivesName = 'pig2_slayer_plus' }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }

          mixin {
              add sourceSets.main, 'pig2slayerplus.refmap.json'
              config 'pig2slayerplus.mixins.json'
          }

          repositories { mavenCentral() }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
              annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
          }

          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

          jar {
              manifest.attributes('MixinConfigs': 'pig2slayerplus.mixins.json')
              finalizedBy 'reobfJar'
          }
          P2S_EOF
          mkdir -p src/main/resources/META-INF
          cat > src/main/resources/META-INF/mods.toml <<'P2S_EOF'
          modLoader="javafml"
          loaderVersion="[47,)"
          license="All Rights Reserved"

          [[mods]]
          modId="pig2_slayer_plus"
          version="1.1.0"
          displayName="Pig Slayer Plus"
          authors="you"
          description='''Addon cho pig2_slayer: cam dreams blade la bat tu, chuot phai xoa quai, danh la xoa.'''

          [[dependencies.pig2_slayer_plus]]
          modId="forge"
          mandatory=true
          versionRange="[47,)"
          ordering="NONE"
          side="BOTH"

          [[dependencies.pig2_slayer_plus]]
          modId="minecraft"
          mandatory=true
          versionRange="[1.20.1,1.21)"
          ordering="NONE"
          side="BOTH"
          P2S_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/pack.mcmeta <<'P2S_EOF'
          {
            "pack": { "description": { "text": "pig2_slayer_plus resources" }, "pack_format": 15 }
          }
          P2S_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/pig2slayerplus.mixins.json <<'P2S_EOF'
          {
            "required": false,
            "minVersion": "0.8",
            "package": "com.pig2.slayerplus.mixin",
            "compatibilityLevel": "JAVA_17",
            "refmap": "pig2slayerplus.refmap.json",
            "priority": 2147483647,
            "mixins": [
              "EntityAccessor",
              "EntityMixin",
              "LivingEntityMixin",
              "PlayerMixin",
              "ServerPlayerMixin"
            ],
            "injectors": { "defaultRequire": 1 }
