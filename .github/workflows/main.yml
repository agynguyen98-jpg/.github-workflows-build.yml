          cat > src/main/java/com/pig2/slayerplus/mixin/LivingEntityMixin.java <<'P2S_EOF'
          package com.pig2.slayerplus.mixin;

          import com.pig2.slayerplus.GodHelper;
          import net.minecraft.world.damagesource.DamageSource;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Shadow;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(LivingEntity.class)
          public abstract class LivingEntityMixin {

              @Shadow
              public abstract float getMaxHealth();

              @Inject(method = "hurt", at = @At("HEAD"), cancellable = true)
              private void p2s$noHurt(DamageSource source, float amount, CallbackInfoReturnable<Boolean> cir) {
                  if (GodHelper.isGod((Entity) (Object) this)) {
                      cir.setReturnValue(false);
                  }
              }

              @Inject(method = "die", at = @At("HEAD"), cancellable = true)
              private void p2s$noDie(DamageSource source, CallbackInfo ci) {
                  if (GodHelper.isGod((Entity) (Object) this)) {
                      ci.cancel();
                  }
              }

              @Inject(method = "setHealth", at = @At("HEAD"), cancellable = true)
              private void p2s$noHealthDrop(float value, CallbackInfo ci) {
                  if (GodHelper.isGod((Entity) (Object) this) && value < this.getMaxHealth()) {
                      ci.cancel();
                  }
              }

              @Inject(method = "getHealth", at = @At("HEAD"), cancellable = true)
              private void p2s$fullHealth(CallbackInfoReturnable<Float> cir) {
                  if (GodHelper.isGod((Entity) (Object) this)) {
                      cir.setReturnValue(this.getMaxHealth());
                  }
              }

              @Inject(method = "isDeadOrDying", at = @At("HEAD"), cancellable = true)
              private void p2s$notDying(CallbackInfoReturnable<Boolean> cir) {
                  if (GodHelper.isGod((Entity) (Object) this)) {
                      cir.setReturnValue(false);
                  }
              }
          }
          P2S_EOF
