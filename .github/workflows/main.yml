          mkdir -p src/main/java/com/pig2/slayerplus
          cat > src/main/java/com/pig2/slayerplus/GodHelper.java <<'P2S_EOF'
          package com.pig2.slayerplus;

          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraftforge.registries.ForgeRegistries;

          public final class GodHelper {
              public static final String TAG = "p2s_god";
              private static final ResourceLocation BLADE_ID = new ResourceLocation("pig2_slayer", "slayer_blade");
              private static volatile Item blade;

              private GodHelper() {
              }

              /** Nhan dien dreams blade cua pig2_slayer theo ten dang ky, khong can phu thuoc compile. */
              public static boolean isBlade(ItemStack s) {
                  try {
                      if (s == null || s.isEmpty()) {
                          return false;
                      }
                      Item b = blade;
                      if (b == null) {
                          if (!ForgeRegistries.ITEMS.containsKey(BLADE_ID)) {
                              return false;
                          }
                          b = ForgeRegistries.ITEMS.getValue(BLADE_ID);
                          blade = b;
                      }
                      return s.getItem() == b;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static boolean holdsBlade(LivingEntity e) {
                  return isBlade(e.getMainHandItem()) || isBlade(e.getOffhandItem());
              }

              /** Bat tu neu co tag p2s_god HOAC dang cam dreams blade. */
              public static boolean isGod(Entity e) {
                  try {
                      if (e == null) {
                          return false;
                      }
                      if (e.getTags().contains(TAG)) {
                          return true;
                      }
                      return e instanceof LivingEntity le && holdsBlade(le);
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Chi chan viec bi giet/xoa; van cho phep doi chieu, unload chunk. */
              public static boolean blocksRemoval(Entity.RemovalReason r) {
                  return r == Entity.RemovalReason.KILLED || r == Entity.RemovalReason.DISCARDED;
              }
          }
          P2S_EOF
          mkdir -p src/main/java/com/pig2/slayerplus
          cat > src/main/java/com/pig2/slayerplus/BladePower.java <<'P2S_EOF'
          package com.pig2.slayerplus;

          import com.pig2.slayerplus.mixin.EntityAccessor;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.effect.MobEffectCategory;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.entity.decoration.ArmorStand;
          import net.minecraft.world.level.entity.EntityInLevelCallback;
          import net.minecraft.world.entity.monster.Enemy;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.entity.projectile.Projectile;
          import net.minecraft.world.phys.AABB;
          import net.minecraftforge.common.Tags;

          import java.util.ArrayList;
          import java.util.List;

          public final class BladePower {
              public static final double RADIUS = 96.0;

              private BladePower() {
              }

              /** Xoa entity theo nhieu lop: setRemoved -> discard -> goi thang levelCallback. */
              public static boolean forceRemove(Entity e) {
                  if (e == null || e instanceof Player || GodHelper.isGod(e)) {
                      return false;
                  }
                  try {
                      e.setRemoved(Entity.RemovalReason.KILLED);
                  } catch (Throwable ignored) {
                  }
                  if (e.isRemoved()) {
                      return true;
                  }
                  try {
                      e.discard();
                  } catch (Throwable ignored) {
                  }
                  if (e.isRemoved()) {
                      return true;
                  }
                  try {
                      EntityAccessor acc = (EntityAccessor) e;
                      if (acc.p2s$getRemovalReason() == null) {
                          acc.p2s$setRemovalReason(Entity.RemovalReason.KILLED);
                      }
                      EntityInLevelCallback cb = acc.p2s$getLevelCallback();
                      if (cb != null) {
                          cb.onRemove(Entity.RemovalReason.KILLED);
                      }
                      return true;
                  } catch (Throwable ignored) {
                  }
                  return e.isRemoved();
              }

              private static boolean shouldWipe(Entity e, Player user, boolean all) {
                  if (e == user || e instanceof Player || e instanceof ArmorStand || GodHelper.isGod(e)) {
                      return false;
                  }
                  if (e instanceof Projectile p) {
                      return p.getOwner() != user;
                  }
                  if (!(e instanceof LivingEntity)) {
                      return false;
                  }
                  if (all) {
                      return true;
                  }
                  if (e instanceof Enemy) {
                      return true;
                  }
                  if (e.getType().is(Tags.EntityTypes.BOSSES)) {
                      return true;
                  }
                  return e instanceof Mob m && m.getTarget() == user;
              }

              /** Chuot phai: xoa quai/boss/dan trong ban kinh. Shift + chuot phai: xoa moi sinh vat (tru nguoi choi). */
              public static int sweep(ServerPlayer player, boolean all) {
                  ServerLevel level = player.serverLevel();
                  AABB box = player.getBoundingBox().inflate(RADIUS);
                  List<Entity> targets = new ArrayList<>(level.getEntities((Entity) null, box, e -> shouldWipe(e, player, all)));
                  int n = 0;
                  for (Entity e : targets) {
                      if (forceRemove(e)) {
                          n++;
                      }
                  }
                  return n;
              }

              /** Duy tri trang thai bat tu moi tick cho nguoi dang cam kiem. */
              public static void maintain(Player p) {
                  p.setHealth(p.getMaxHealth());
                  p.getFoodData().setFoodLevel(20);
                  p.getFoodData().setSaturation(20.0F);
                  p.clearFire();
                  p.fallDistance = 0.0F;
                  p.setAirSupply(p.getMaxAirSupply());
                  for (MobEffectInstance inst : new ArrayList<>(p.getActiveEffects())) {
                      if (inst.getEffect().getCategory() == MobEffectCategory.HARMFUL) {
                          p.removeEffect(inst.getEffect());
                      }
                  }
              }

              public static void say(Player p, String msg) {
                  p.displayClientMessage(Component.literal(msg), true);
              }
          }
          P2S_EOF
          mkdir -p src/main/java/com/pig2/slayerplus
          cat > src/main/java/com/pig2/slayerplus/P2sEvents.java <<'P2S_EOF'
          package com.pig2.slayerplus;

          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.event.entity.living.LivingAttackEvent;
          import net.minecraftforge.event.entity.living.LivingDamageEvent;
          import net.minecraftforge.event.entity.living.LivingDeathEvent;
          import net.minecraftforge.event.entity.living.LivingHurtEvent;
          import net.minecraftforge.event.entity.living.LivingKnockBackEvent;
          import net.minecraftforge.event.entity.player.AttackEntityEvent;
          import net.minecraftforge.event.entity.player.PlayerInteractEvent;
          import net.minecraftforge.eventbus.api.EventPriority;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;

          @Mod.EventBusSubscriber(modid = Pig2SlayerPlus.MODID)
          public class P2sEvents {

              private static final Map<UUID, Long> LAST_USE = new HashMap<>();

              // ---------- Bat tu khi cam kiem (lop bao ve bang su kien, ben canh mixin) ----------

              @SubscribeEvent(priority = EventPriority.HIGHEST, receiveCanceled = true)
              public static void onAttack(LivingAttackEvent e) {
                  if (GodHelper.isGod(e.getEntity())) {
                      e.setCanceled(true);
                  }
              }

              @SubscribeEvent(priority = EventPriority.HIGHEST, receiveCanceled = true)
              public static void onHurt(LivingHurtEvent e) {
                  if (GodHelper.isGod(e.getEntity())) {
                      e.setCanceled(true);
                  }
              }

              @SubscribeEvent(priority = EventPriority.HIGHEST, receiveCanceled = true)
              public static void onDamage(LivingDamageEvent e) {
                  if (GodHelper.isGod(e.getEntity())) {
                      e.setCanceled(true);
                  }
              }

              @SubscribeEvent(priority = EventPriority.HIGHEST, receiveCanceled = true)
              public static void onDeath(LivingDeathEvent e) {
                  if (GodHelper.isGod(e.getEntity())) {
                      e.setCanceled(true);
                      e.getEntity().setHealth(e.getEntity().getMaxHealth());
                  }
              }

              @SubscribeEvent(priority = EventPriority.HIGHEST, receiveCanceled = true)
              public static void onKnockback(LivingKnockBackEvent e) {
                  if (GodHelper.isGod(e.getEntity())) {
                      e.setCanceled(true);
                  }
              }

              @SubscribeEvent
              public static void onPlayerTick(TickEvent.PlayerTickEvent e) {
                  if (e.phase == TickEvent.Phase.END && e.side.isServer() && GodHelper.isGod(e.player)) {
                      BladePower.maintain(e.player);
                  }
              }

              // ---------- Chuot phai voi dreams blade ----------

              private static void rightClick(Player player, Entity directTarget) {
                  if (player.level().isClientSide || !(player instanceof ServerPlayer sp)) {
                      return;
                  }
                  if (!GodHelper.holdsBlade(sp)) {
                      return;
                  }
                  long now = sp.level().getGameTime();
                  Long last = LAST_USE.get(sp.getUUID());
                  if (last != null && now - last < 5L) {
                      return;
                  }
                  LAST_USE.put(sp.getUUID(), now);

                  int n = BladePower.sweep(sp, sp.isShiftKeyDown());
                  if (directTarget != null && BladePower.forceRemove(directTarget)) {
                      n++;
                  }
                  BladePower.say(sp, "Dreams blade: da xoa " + n + " entity" + (sp.isShiftKeyDown() ? " (che do tat ca)" : ""));
              }

              @SubscribeEvent
              public static void onRightClickItem(PlayerInteractEvent.RightClickItem e) {
                  rightClick(e.getEntity(), null);
              }

              @SubscribeEvent
              public static void onRightClickBlock(PlayerInteractEvent.RightClickBlock e) {
                  rightClick(e.getEntity(), null);
              }

              @SubscribeEvent
              public static void onRightClickEntity(PlayerInteractEvent.EntityInteract e) {
                  rightClick(e.getEntity(), e.getTarget());
              }

              // ---------- Danh la xoa ----------

              @SubscribeEvent
              public static void onAttackEntity(AttackEntityEvent e) {
                  Player p = e.getEntity();
                  if (p.level().isClientSide || !GodHelper.holdsBlade(p)) {
                      return;
                  }
                  BladePower.forceRemove(e.getTarget());
              }
          }
          P2S_EOF
          mkdir -p src/main/java/com/pig2/slayerplus
          cat > src/main/java/com/pig2/slayerplus/P2sCommands.java <<'P2S_EOF'
          package com.pig2.slayerplus;

          import com.mojang.brigadier.context.CommandContext;
          import net.minecraft.commands.CommandSourceStack;
          import net.minecraft.commands.Commands;
          import net.minecraft.commands.arguments.EntityArgument;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.entity.Entity;
          import net.minecraftforge.event.RegisterCommandsEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          import java.util.Collection;

          @Mod.EventBusSubscriber(modid = Pig2SlayerPlus.MODID)
          public class P2sCommands {

              @SubscribeEvent
              public static void onRegister(RegisterCommandsEvent event) {
                  event.getDispatcher().register(
                      Commands.literal("p2s").requires(s -> s.hasPermission(2))
                          .then(Commands.literal("god")
                              .executes(ctx -> toggle(ctx, java.util.List.of(ctx.getSource().getEntityOrException())))
                              .then(Commands.argument("targets", EntityArgument.entities())
                                  .executes(ctx -> toggle(ctx, EntityArgument.getEntities(ctx, "targets")))))
                          .then(Commands.literal("remove")
                              .then(Commands.argument("targets", EntityArgument.entities())
                                  .executes(ctx -> remove(ctx, EntityArgument.getEntities(ctx, "targets")))))
                  );
              }

              private static int toggle(CommandContext<CommandSourceStack> ctx, Collection<? extends Entity> targets) {
                  int n = 0;
                  for (Entity e : targets) {
                      if (e.getTags().contains(GodHelper.TAG)) {
                          e.removeTag(GodHelper.TAG);
                      } else {
                          e.addTag(GodHelper.TAG);
                      }
                      n++;
                  }
                  final int count = n;
                  ctx.getSource().sendSuccess(() -> Component.literal("p2s god: da doi trang thai cho " + count + " entity"), true);
                  return n;
              }

              private static int remove(CommandContext<CommandSourceStack> ctx, Collection<? extends Entity> targets) {
                  int n = 0;
                  for (Entity e : targets) {
                      if (BladePower.forceRemove(e)) {
                          n++;
                      }
                  }
                  final int count = n;
                  ctx.getSource().sendSuccess(() -> Component.literal("p2s remove: da xoa " + count + " entity"), true);
                  return n;
              }
          }
