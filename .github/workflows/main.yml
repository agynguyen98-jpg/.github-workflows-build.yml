          cat > src/main/java/com/pig2/slayerplus/mixin/EntityAccessor.java <<'P2S_EOF'
          package com.pig2.slayerplus.mixin;

          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.level.entity.EntityInLevelCallback;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Accessor;

          @Mixin(Entity.class)
          public interface EntityAccessor {

              @Accessor("levelCallback")
              EntityInLevelCallback p2s$getLevelCallback();

              @Accessor("removalReason")
              Entity.RemovalReason p2s$getRemovalReason();

              @Accessor("removalReason")
              void p2s$setRemovalReason(Entity.RemovalReason reason);
          }
          P2S_EOF
          mkdir -p src/main/java/com/pig2/slayerplus/mixin
          cat > src/main/java/com/pig2/slayerplus/mixin/EntityMixin.java <<'P2S_EOF'
          package com.pig2.slayerplus.mixin;

          import com.pig2.slayerplus.GodHelper;
          import net.minecraft.world.entity.Entity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(Entity.class)
          public abstract class EntityMixin {

              @Inject(method = "setRemoved", at = @At("HEAD"), cancellable = true)
              private void p2s$blockRemoval(Entity.RemovalReason reason, CallbackInfo ci) {
                  if (GodHelper.isGod((Entity) (Object) this) && GodHelper.blocksRemoval(reason)) {
                      ci.cancel();
                  }
              }
          }
          P2S_EOF
