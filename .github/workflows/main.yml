          mkdir -p src/main/java/com/pig2/slayerplus
          cat > src/main/java/com/pig2/slayerplus/Pig2SlayerPlus.java <<'P2S_EOF'
          package com.pig2.slayerplus;

          import net.minecraftforge.fml.common.Mod;

          @Mod(Pig2SlayerPlus.MODID)
          public class Pig2SlayerPlus {
              public static final String MODID = "pig2_slayer_plus";

              public Pig2SlayerPlus() {
              }
